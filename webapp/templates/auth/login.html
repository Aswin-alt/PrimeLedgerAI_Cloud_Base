{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block public %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-brand-900 to-slate-800 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">PrimeLedgerAI</h1>
      <p class="text-slate-300 mt-2">Cloud Accounting Platform</p>
    </div>
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-1">Sign in</h2>
      <p class="text-sm text-slate-500 mb-6">Use your assigned credentials</p>
      {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 px-3 py-2 text-sm">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input name="username" class="input" required autofocus />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" class="input" required />
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
