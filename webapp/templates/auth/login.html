{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block public %}
<div class="login-shell relative">
  <button type="button" class="btn btn-theme login-theme-toggle" title="Toggle day / night mode"
          onclick="PLATheme.toggle(); this.querySelector('[data-icon-day]').hidden = PLATheme.get()==='night'; this.querySelector('[data-icon-night]').hidden = PLATheme.get()!=='night';">
    <span data-icon-day>☾</span>
    <span data-icon-night hidden>☀</span>
  </button>

  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <img src="/static/img/primeledger-logo.png" alt="PrimeLedgerAI" class="brand-logo brand-logo-lg mx-auto mb-4 shadow-sm" />
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight" style="color: #fff">PrimeLedgerAI</h1>
      <p class="mt-1 text-sm" style="color: rgba(255,255,255,0.75)">Cloud Accounting Platform</p>
    </div>
    <div class="login-card">
      <h2 class="text-xl font-semibold mb-1" style="color: var(--text)">Sign in</h2>
      <p class="text-sm theme-muted mb-6">Use your assigned credentials</p>
      {% if error %}
      <div class="mb-4 rounded-lg flash-err px-3 py-2 text-sm">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 theme-muted">Username</label>
          <input name="username" class="input" required autofocus autocomplete="username" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 theme-muted">Password</label>
          <input type="password" name="password" class="input" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign in</button>
      </form>
    </div>
    <p class="text-center text-xs mt-6" style="color: rgba(255,255,255,0.55)">© PrimeLedgerAI · Secure session</p>
  </div>
</div>
<script>
  (function () {
    var day = document.querySelector('[data-icon-day]');
    var night = document.querySelector('[data-icon-night]');
    function sync() {
      var t = PLATheme.get();
      if (day) day.hidden = t === 'night';
      if (night) night.hidden = t !== 'night';
      // Day-mode login title should use navy when shell is light
      var titles = document.querySelectorAll('.login-shell h1, .login-shell p, .login-shell .text-center + p');
      var shellText = document.querySelectorAll('.login-shell > .w-full > .text-center h1, .login-shell > .w-full > .text-center p, .login-shell > .w-full > p');
      shellText.forEach(function (el) {
        if (t === 'day') {
          el.style.color = el.tagName === 'H1' ? '#0b1f3a' : '#64748b';
        } else {
          el.style.color = el.tagName === 'H1' ? '#ffffff' : 'rgba(255,255,255,0.75)';
        }
      });
      var foot = document.querySelector('.login-shell > .w-full > p');
      if (foot) foot.style.color = t === 'day' ? '#94a3b8' : 'rgba(255,255,255,0.55)';
    }
    document.addEventListener('pla-theme', sync);
    sync();
  })();
</script>
{% endblock %}
